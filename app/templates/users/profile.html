{% extends "base.html" %}
{% block title %}Profile – Radixsol CRM{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="text-xl font-semibold mb-4">My Profile</h1>
  <div class="card p-6">
    {% if error %}
      <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded text-sm text-red-700">{{ error }}</div>
    {% endif %}
    <form method="post" action="/users/profile" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Full Name</label>
        <input name="full_name" value="{{ user.full_name }}" required class="input" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input value="{{ user.email }}" disabled class="input bg-slate-50 text-slate-400" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Role</label>
        <input value="{{ user.role.value | humanize }}" disabled class="input bg-slate-50 text-slate-400" />
      </div>
      <hr class="border-slate-200" />
      <p class="text-sm text-slate-500">Leave password fields blank to keep current password.</p>
      <div>
        <label class="block text-sm font-medium mb-1">Current Password</label>
        <input type="password" name="current_password" class="input" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">New Password</label>
        <input type="password" name="new_password" minlength="8" class="input" />
      </div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
